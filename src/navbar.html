<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Navbar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .navbar-custom {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background-color: #000000; /* Black background */
    }
    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link {
      color: #ffffff; /* White text */
    }
    .navbar-custom .nav-link:hover {
      color: #ffd700; /* Gold color for hover */
    }
    .navbar-custom .dropdown-menu {
      background-color: #000000; /* Ensure dropdown menu is also black */
    }
    .navbar-custom .dropdown-item {
      color: #ffffff; /* White text for dropdown items */
    }
    .navbar-custom .dropdown-item:hover {
      color: #ffd700; /* Gold color for dropdown item hover */
      background-color: #333333; /* Slightly lighter black for hover */
    }
    .urgent-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff; /* White text */
      font-weight: bold;
      padding: 5px 15px;
      background-color: #d9534f; /* Red background for urgency */
      border-radius: 5px;
      z-index: 999; /* Make sure it's above other navbar content */
      text-decoration: none; /* Remove underline from link */
      cursor: pointer;
    }
    .urgent-message:hover {
      background-color: #c9302c; /* Darker red on hover */
    }
    .navbar-collapse {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content {
      margin-top: 56px; /* Adjust based on navbar height */
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Services
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" href="#">Web Development</a></li>
              <li><a class="dropdown-item" href="#">App Development</a></li>
              <li><a class="dropdown-item" href="#">SEO Optimization</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
        <form class="d-flex ms-auto">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
      </div>
      <!-- Urgent message inside the navbar -->
      <div>
        <a class="urgent-message" onclick="window.location.href='warn';">
          >>Urgent requirement!: Hiring HR & accounting staff! Click to Register<<
        </a>
      </div>
    </div>
  </nav>
  <div class="content">
    <!-- This placeholder will ensure that content below the navbar is not overlapped -->
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
