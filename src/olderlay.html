<div style="
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
  background: rgba(0, 0, 0, 0.7); color: white; display: flex; 
  justify-content: center; align-items: center; z-index: 1000;
">
  <div style="text-align: center; background: #333; padding: 20px; border-radius: 10px;">
    <h2 style="color: white;">Content Policy Notice</h2>
    <p style="margin-bottom: 20px;">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

</div>

</script>
